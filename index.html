<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3C3C3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schraubenfabrik Hagen">
<meta name="description" content="Audioguide – Alte Schraubenfabrik Funcke &amp; Hueck, Hagen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>Alte Schraubenfabrik Hagen – Audioguide</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; padding: 0;
    height: 100%; font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    background: #3C3C3B;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
  .scroll  { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  .hscroll { display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  input, textarea, select, button { font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; }
  @keyframes fadein  { from { opacity:0; transform:translateY(8px)  } to { opacity:1; transform:translateY(0) } }
  @keyframes fadeup  { from { opacity:0; transform:translateY(18px) } to { opacity:1; transform:translateY(0) } }
  @keyframes scan-ln { 0%{top:4%}100%{top:92%} }
  @keyframes ping    { 0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)} }
  @keyframes popin   { 0%{opacity:0;transform:scale(.75)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)} }
  @keyframes spin    { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
  @keyframes shake   { 0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)} }
  .shake { animation: shake .38s ease both; }
  button:active, .tap:active { opacity: .72; transition: opacity .08s; }
  .safe-top    { padding-top: env(safe-area-inset-top, 0px); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .safe-sides  { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

  /* ── Desktop-Layout ──────────────────────────────────────────
     Besucher-Ansicht: auf breiten Bildschirmen als zentrierte
     "Handy-Karte" darstellen (Besucher nutzen ohnehin ein Handy).
     Admin-Bereich: volle Breite mit Seitenleiste statt Reiter-Tabs,
     damit Formulare zum Bearbeiten mehr Platz haben. */
  @media (min-width: 860px) {
    body { display: flex; align-items: center; justify-content: center; }
    #app.mode-visitor {
      position: relative; inset: auto;
      width: min(94vw, 1000px); height: 90vh; max-height: 960px;
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
    }
    #app.mode-admin {
      position: relative; inset: auto;
      width: 100%; max-width: 1180px; height: 88vh; max-height: 920px;
      border-radius: 20px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
      flex-direction: row !important;
    }
    #app.mode-admin > div:first-child { flex-direction: row !important; height: 100% !important; }
    .admin-sidebar {
      width: 210px; flex-shrink: 0; display: flex !important; flex-direction: column !important;
      padding-top: 0 !important; border-right: 1px solid rgba(255,255,255,.07);
    }
    .admin-sidebar .admin-topbar-row { height: 60px; }
    .admin-nav-tabs {
      flex-direction: column !important; border-top: none !important;
      padding: 10px; gap: 2px; flex: 1;
    }
    .admin-nav-tabs button {
      flex: none !important; text-align: left !important; border-bottom: none !important;
      border-left: 2.5px solid transparent !important; border-radius: 8px;
      padding: 11px 14px !important;
    }
    .admin-nav-tabs button[data-current="true"] { background: rgba(201,168,124,.1); border-left-color: #C9A87C !important; }
    .admin-main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
    .admin-edit-layout { display: grid !important; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
    .admin-edit-layout .admin-edit-side { position: sticky; top: 0; }
    .admin-qr-layout { display: grid !important; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
    .admin-stat-grid { grid-template-columns: repeat(4, 1fr) !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="./src/vendor/supabase.js"></script>
<script src="./src/vendor/jsQR.js"></script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
