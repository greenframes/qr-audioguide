      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; }\n  @keyframes fadein  { from { opacity:0; transform:translateY(8px)  } to { opacity:1; transform:translateY(0) } }\n  @keyframes fadeup  { from { opacity:0; transform:translateY(18px) } to { opacity:1; transform:translateY(0) } }\n  @keyframes scan-ln { 0%{top:4%}100%{top:92%} }\n  @keyframes ping    { 0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)} }\n  @keyframes popin   { 0%{opacity:0;transform:scale(.75)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)} }\n  @keyframes spin    { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }\n  @keyframes shake   { 0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)} }\n  .shake { animation: shake .38s ease both; }\n  button:active, .tap:active { opacity: .72; transition: opacity .08s; }\n  /* Safe area padding */\n  .safe-top    { padding-top: env(safe-area-inset-top, 0px); }\n  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }\n  .safe-sides  { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }\n  /* Admin table */\n  @media (max-width: 700px) {\n    .admin-table-cols { grid-template-columns: 32px 36px 1fr 90px 52px !important; }\n    .admin-col-edited, .admin-col-actions { display: none !important; }\n  }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div id=\"app\"><\u002Fdiv>\n\n<script>\n// ── DATA ────────────────────────────────────────────────────\nconst STATIONS = [\n  { id:'01', img:'img/st01.jpg', title:'Gründung 1844 & die erste Dampfmaschine', sub:'Auftakt · Hagen wird Industriestadt', era:'1844', dur:250, scans:312, status:'pub',\n    audio:'Der Anfang — Kaufleute werden Fabrikanten',\n    desc:'Im Jahr 1844 gründeten der Kaufmann Bernhard Wilhelm Funcke und sein Neffe Friedrich Hueck in Hagen eine Schraubenfabrik. Beide gehörten zu jener Generation, die Kapital, Handelskenntnisse und familiäre Netzwerke aus dem Handel in neue industrielle Unternehmungen überführte.\\n\\nNoch im selben Jahr nahm der Betrieb die erste Dampfmaschine des damaligen Hagener Stadtkreises in Betrieb. Das war mehr als eine technische Randnotiz: Wo zuvor Wasserkraft und Handarbeit die Metallverarbeitung bestimmten, trat nun eine Energiequelle, die unabhängig von Jahreszeit und Wasserstand arbeitete. Die Gründung fällt damit genau in jene Phase, in der sich Hagen von einem regionalen Handels- und Gewerbeort zu einem Industriezentrum entwickelte.\\n\\nBereits 1846 schied der ältere Funcke aus der Unternehmensleitung aus. Sein Sohn Wilhelm übernahm gemeinsam mit Friedrich Hueck — und wurde später zu einer der prägenden Unternehmerpersönlichkeiten der Stadt.\\n\\nEin Hinweis zum Ort, an dem Sie stehen: Das Gebäude vor Ihnen stammt nicht aus dem Gründungsjahr. Die Fabrik kam erst deutlich später hierher. Davon erzählt Station 5.',\n    edited:'vor 1 Tag' },\n\n  { id:'02', img:'img/st07.jpg', title:'Eisenbahn & Serienfertigung', sub:'Absatzmarkt und Lebensader zugleich', era:'ab 1850', dur:225, scans:278, status:'pub',\n    audio:'Schrauben für ein wachsendes Schienennetz',\n    desc:'Mit dem starken Ausbau des Eisenbahnnetzes ab der Mitte des 19. Jahrhunderts stieg der Bedarf an standardisierten, hoch belastbaren Verbindungselementen sprunghaft an. Jede Schiene, jede Weiche, jede Brücke brauchte Schrauben, Bolzen und Muttern, die zuverlässig gleich waren — eine Anforderung, die handwerkliche Fertigung nicht erfüllen konnte.\\n\\nSeit etwa 1850 fertigte Funcke & Hueck nachweislich Eisenbahnbedarf und Material für den Eisenbahnoberbau: Schrauben, Bolzen, Muttern und weitere Befestigungsteile.\\n\\nDie Eisenbahn war für das Unternehmen in doppelter Hinsicht entscheidend. Sie war der wichtigste Absatzmarkt — und zugleich die Voraussetzung dafür, Rohstoffe in großen Mengen heranzuschaffen und fertige Ware überregional zu versenden. Ohne Schiene keine Serienfertigung, ohne Serienfertigung keine Schiene. Diese wechselseitige Abhängigkeit prägte das Werk über Jahrzehnte und erklärt, warum später die Nähe zum Hauptbahnhof über den Standort entschied.',\n    edited:'vor 1 Tag' },\n\n  { id:'03', img:'img/st03.jpg', title:'Gesenkschmiede & Riemenfallhammer', sub:'Technische Innovation', era:'1860', dur:240, scans:241, status:'pub',\n    audio:'Der erste Riemenfallhammer Deutschlands',\n    desc:'1860 wurde dem Unternehmen eine Gesenkschmiede angegliedert. Nach der archivalischen Überlieferung kam dort der erste Riemenfallhammer Deutschlands zum Einsatz.\\n\\nDas Verfahren funktioniert im Kern so: Glühendes Metall wird zwischen zwei formgebende Werkzeuge gelegt, die Gesenke genannt werden. Ein schwerer Hammerbär fällt wiederholt darauf und presst das Material in die vorgegebene Form. Ein Riemen hebt den Bären zwischen den Schlägen wieder an — daher der Name.\\n\\nFür Funcke & Hueck bedeutete das eine erhebliche Erweiterung der Möglichkeiten. Neben einfachen Schrauben ließen sich nun auch anspruchsvollere, hoch belastbare Schmiedeteile wirtschaftlich in großen Stückzahlen herstellen.\\n\\nDer Lärm dieser Arbeit war weithin zu hören, die Hitze an den Feuern enorm. Was heute nach Technikgeschichte klingt, war für die Beschäftigten körperliche Schwerarbeit über lange Schichten.',\n    edited:'vor 2 Tagen' },\n\n  { id:'04', img:'img/st04.jpg', title:'Wachstum zum Großbetrieb', sub:'Von 300 auf 1.500 Beschäftigte', era:'1850–1933', dur:215, scans:224, status:'pub',\n    audio:'Eine Fabrik und ihre Belegschaft',\n    desc:'Die Zahlen erzählen die Geschichte dieser Fabrik so deutlich wie kaum etwas anderes. Mitte der 1850er-Jahre arbeiteten hier bereits ungefähr 300 bis 400 Menschen. Für 1872 werden rund 600 Beschäftigte genannt. Den höchsten bekannten Stand erreichte der Betrieb 1913 mit etwa 1.500 Arbeitern und Angestellten. 1933 — nach Weltkrieg, Inflation und Weltwirtschaftskrise — waren es noch rund 1.000.\\n\\nDamit war Funcke & Hueck über Jahrzehnte einer der bedeutendsten Arbeitgeber Hagens.\\n\\nDoch die wirtschaftliche Bedeutung reichte weit über die eigentliche Belegschaft hinaus. Familien lebten von diesen Löhnen. Zulieferer, Fuhrunternehmen, Händler und Handwerksbetriebe waren direkt oder indirekt mit dem Werk verbunden. Eine Fabrik dieser Größe formte einen ganzen Stadtteil — seine Wohnhäuser, seine Wege, seinen Tagesrhythmus.',\n    edited:'vor 2 Tagen' },\n\n  { id:'05', img:'img/st08.jpg', title:'Der Standort an der Ennepe', sub:'Warum die Fabrik hierher kam', era:'1884 / 1905–06', dur:265, scans:198, status:'pub',\n    audio:'Bahn, Fluss und Fläche',\n    desc:'Mit dem Wachstum reichten die älteren Produktionsflächen nicht mehr aus. 1884 wurde zunächst die Gesenkschmiede in das Gebiet westlich des Hagener Hauptbahnhofs verlagert. Ab 1905 beziehungsweise 1906 war dort auch die Schraubenfabrik selbst ansässig. Das ist der Ort, an dem Sie sich gerade befinden.\\n\\nDer Standort bot alles, was ein wachsender Industriebetrieb brauchte: große Flächen, eine günstige Eisenbahnanbindung und gute Voraussetzungen für die Anlieferung schwerer Rohstoffe.\\n\\nIn unmittelbarer Nähe lag das mit der Familie verbundene Puddel- und Walzwerk Funcke & Elbers, das der Versorgung mit geeignetem Vormaterial diente. Diese Nähe zwischen Rohstoffaufbereitung, Walzwerk, Schmiede und Schraubenproduktion zeigt, wie arbeitsteilig und zugleich eng verflochten die Hagener Metallindustrie bereits im 19. Jahrhundert war.\\n\\nDas Gebäude liegt am Fuß der Philippshöhe, parallel zur Ennepe. Achten Sie auf die langen Fensterreihen: Sie sollten so viel Tageslicht wie möglich in die Produktionsräume bringen. Im Laufe der Zeit entstand hier ein weitläufiger Komplex, dessen Bauteile über Treppen, Aufzüge und Übergänge verbunden waren — das erhaltene Gebäude zeigt nur noch einen kleinen Ausschnitt davon.',\n    edited:'vor 3 Tagen' },\n\n  { id:'06', img:'img/st05.jpg', title:'Frühe betriebliche Sozialpolitik', sub:'Fürsorge und Abhängigkeit', era:'ab 1855', dur:230, scans:176, status:'pub',\n    audio:'Unterstützungskasse, Sparkasse, Werkswohnung',\n    desc:'Funcke & Hueck führte vergleichsweise früh Einrichtungen für die Belegschaft ein. Belegt sind eine Unterstützungskasse ab 1855 und eine Arbeitersparkasse ab 1869. Später kamen Werkswohnungen, Versorgungs- und Speiseeinrichtungen sowie weitere Spar- und Pensionsangebote hinzu.\\n\\nDie Unterstützungskasse wuchs beträchtlich: 1880 zählte sie 375 Mitglieder, 1885 waren es 551, 1890 bereits 930 und 1895 schließlich 986. Vieles davon entstand lange vor dem vollständigen Ausbau der staatlichen Sozialversicherung.\\n\\nMan sollte diese Fürsorge allerdings nicht ausschließlich aus heutiger Sicht romantisieren. Solche betrieblichen Systeme boten echten Schutz und echte Unterstützung. Sie banden die Beschäftigten aber zugleich eng an den Arbeitgeber und waren Teil einer paternalistisch geprägten Unternehmenskultur. Wer die Werkswohnung verlor, verlor oft beides — Arbeit und Zuhause.',\n    edited:'vor 3 Tagen' },\n\n  { id:'07', img:'img/st02.jpg', title:'Menschen & Netzwerk', sub:'Vom Schruwen-Willm bis Liselotte Funcke', era:'1820–2012', dur:300, scans:0, status:'draft',\n    audio:'Unternehmer, Mäzene, Politikerinnen',\n    desc:'Hinter der Fabrik stehen Personen, deren Wirken weit über das Werkstor hinausreichte.\\n\\nWilhelm Funcke II., im Volksmund „Schruwen-Willm“, führte das Unternehmen ab 1846 und machte es zum Großbetrieb. Er saß von 1856 bis 1872 in der Handelskammer zu Hagen, war 1868 kurzzeitig ihr Präsident und gehörte zu den Mitbegründern des Centralverbandes Deutscher Industrieller.\\n\\n1875 trat Theodor Springmann als Teilhaber ein und blieb bis 1926. Von 1903 bis 1920 stand er an der Spitze der Handelskammer; 1925 verlieh ihm die Stadt Hagen die Ehrenbürgerwürde. Die Springmannstraße erinnert bis heute an die Familie.\\n\\nBesonders bemerkenswert ist eine kulturgeschichtliche Verbindung: Karl Ernst Osthaus war ein Enkel Wilhelm Funckes. Ein Teil des Vermögens, das hier mit Schrauben und Eisenbahnbedarf entstand, ermöglichte 1902 das Folkwang-Museum und jenen kulturellen Aufbruch, der als „Hagener Impuls“ bekannt wurde.\\n\\nUnd schließlich Liselotte Funcke: Sie arbeitete von 1944 bis 1969 als Prokuristin in diesem Unternehmen und wurde später Bundestagsvizepräsidentin, Wirtschaftsministerin von Nordrhein-Westfalen und Ausländerbeauftragte der Bundesregierung. 2003 wurde sie Ehrenbürgerin ihrer Stadt.',\n    edited:'vor 4 Std.' },\n\n  { id:'08', img:'img/st06.jpg', title:'Kriege, Lost Place & Neubeginn', sub:'1970 bis heute', era:'1914–2026', dur:285, scans:189, status:'pub',\n    audio:'Vom Abriss zum Denkmal mit Zukunft',\n    desc:'Wie andere große metallverarbeitende Betriebe wurde Funcke & Hueck in beiden Weltkriegen in die Kriegswirtschaft einbezogen. Für 1944 ist ein Verlagerungsbetrieb unter der Bezeichnung „Kleinpresswerk“ dokumentiert, ebenso die Verlagerung von Teilen der Produktion in geschützte Bereiche. Zur Frage, ob und in welchem Umfang Zwangsarbeitskräfte eingesetzt wurden, liegen keine gesicherten Angaben vor — hier wäre eine gezielte Archivauswertung nötig, und bis dahin verzichten wir bewusst auf Behauptungen.\\n\\n1970 wurde das Unternehmen an den Neusser Schraubenhersteller Bauer & Schaurte verkauft. Damit endete nach mehr als 120 Jahren die eigenständige Firmengeschichte. Aus dem Namen Bauer & Schaurte entstand die Marke INBUS — erfunden hat Funcke & Hueck dieses System allerdings nicht.\\n\\nAnfang der 1990er-Jahre endete die Produktion. 1991 diente das Gelände als Filmkulisse für Teile von „Manta, Manta“. 2001 wurden große Teile abgerissen, der Rest verfiel und wurde zu einem bekannten Hagener Lost Place.\\n\\nSeit 2021 wird das erhaltene Gebäude denkmalgerecht saniert. Es entstehen Bildungs-, Seminar-, Veranstaltungs-, Hotel- und Gastronomiebereiche. Denkmalpflege heißt hier nicht Konservieren, sondern Weiterbauen.',\n    edited:'vor 5 Tagen' },\n];\n\nconst ADMIN_PW = 'Sonnenblume123#';\n\n// ── STATE ────────────────────────────────────────────────────\nlet state = {\n  view: 'visitor',      // visitor | admin-login | admin\n  vScreen: 'start',     // start | list | scanner | station\n  stIdx: 0,\n  playing: false,\n  elapsed: 0,\n  galIdx: 0,\n  lightbox: false,\n  scanState: 'idle',    // idle | scanning | done\n  // admin\n  aScreen: 'dash',      // dash | edit | qr\n  loginPw: '',\n  loginUser: '',\n  loginErr: false,\n  loginLoading: false,\n  pwVisible: false,\n  editIdx: 0,\n  editTitle: '', editSub: '', editEra: '', editDesc: '', editStatus: 'draft', editDur: 0,\n  searchQ: '', filterStatus: 'all',\n  qrSize: 168,\n  qrLabel: true,\n};\n\n// ── SPEECH SYNTHESIS ─────────────────────────────────────────\nconst STATION_AUDIO = [\n`Station 1. Gründung 1844 und die erste Dampfmaschine Hagens. Im Jahr 1844 gründeten der Kaufmann Bernhard Wilhelm Funcke und sein Neffe Friedrich Hueck in Hagen eine Schraubenfabrik. Beide gehörten zu jener Generation, die Kapital, Handelskenntnisse und familiäre Netzwerke in neue industrielle Unternehmungen überführte. Noch im selben Jahr nahm der Betrieb die erste Dampfmaschine des damaligen Hagener Stadtkreises in Betrieb. Das ist mehr als eine technische Randnotiz: Mit dieser Maschine begann in Hagen das industrielle Dampfzeitalter. Wo zuvor Wasserkraft und Handarbeit die Metallverarbeitung bestimmten, trat nun eine Energiequelle, die unabhängig von Jahreszeit und Wasserstand arbeitete. Bereits 1846 schied der ältere Funcke aus der Unternehmensleitung aus. Sein Sohn Wilhelm übernahm gemeinsam mit Friedrich Hueck — und wurde später zu einer der prägenden Unternehmerpersönlichkeiten der Stadt. Ein Hinweis zum Ort, an dem Sie gerade stehen: Das Gebäude vor Ihnen stammt nicht aus dem Gründungsjahr. Die Fabrik kam erst deutlich später hierher. Davon erzählt Station 5.`,\n\n`Station 2. Eisenbahn und Serienfertigung. Mit dem starken Ausbau des Eisenbahnnetzes ab der Mitte des 19. Jahrhunderts stieg der Bedarf an standardisierten, hoch belastbaren Verbindungselementen sprunghaft an. Jede Schiene, jede Weiche, jede Brücke brauchte Schrauben, Bolzen und Muttern, die zuverlässig gleich waren. Seit etwa 1850 fertigte Funcke und Hueck nachweislich Eisenbahnbedarf und Material für den Eisenbahnoberbau. Die Eisenbahn war für das Unternehmen in doppelter Hinsicht entscheidend. Sie war der wichtigste Absatzmarkt — und sie war zugleich die Voraussetzung dafür, Rohstoffe in großen Mengen heranzuschaffen und fertige Ware überregional zu versenden. Ohne Schiene keine Serienfertigung, ohne Serienfertigung keine Schiene. Diese wechselseitige Abhängigkeit prägte das Werk über Jahrzehnte und erklärt, warum später die Nähe zum Hauptbahnhof über den Standort entschied.`,\n\n`Station 3. Die Gesenkschmiede und der Riemenfallhammer. Im Jahr 1860 wurde dem Unternehmen eine Gesenkschmiede angegliedert. Nach der archivalischen Überlieferung kam dort der erste Riemenfallhammer Deutschlands zum Einsatz. Das Verfahren funktioniert im Kern so: Glühendes Metall wird zwischen zwei formgebende Werkzeuge gelegt, die Gesenke genannt werden. Ein schwerer Hammerbär fällt wiederholt darauf und presst das Material in die vorgegebene Form. Ein Riemen hebt den Bären zwischen den Schlägen wieder an — daher der Name. Für Funcke und Hueck bedeutete das eine erhebliche Erweiterung der Möglichkeiten. Neben einfachen Schrauben ließen sich nun auch anspruchsvollere, hoch belastbare Schmiedeteile wirtschaftlich in großen Stückzahlen herstellen. Der Lärm dieser Arbeit war weithin zu hören, die Hitze an den Feuern enorm. Was heute nach Technikgeschichte klingt, war für die Beschäftigten körperliche Schwerarbeit über lange Schichten.`,\n\n`Station 4. Wachstum zum Großbetrieb. Die Zahlen erzählen die Geschichte dieser Fabrik so deutlich wie kaum etwas anderes. Mitte der 1850er-Jahre arbeiteten hier bereits ungefähr 300 bis 400 Menschen. Für 1872 werden rund 600 Beschäftigte genannt. Den höchsten bekannten Stand erreichte der Betrieb im Jahr 1913 mit etwa 1.500 Arbeitern und Angestellten. 1933, nach Weltkrieg, Inflation und Weltwirtschaftskrise, waren es noch rund 1.000. Damit war Funcke und Hueck über Jahrzehnte einer der bedeutendsten Arbeitgeber Hagens. Doch die wirtschaftliche Bedeutung reichte weit über die eigentliche Belegschaft hinaus. Familien lebten von diesen Löhnen. Zulieferer, Fuhrunternehmen, Händler und Handwerksbetriebe waren direkt oder indirekt mit dem Werk verbunden. Eine Fabrik dieser Größe formte einen ganzen Stadtteil — seine Wohnhäuser, seine Wege, seinen Tagesrhythmus.`,\n\n`Station 5. Der Standort an der Ennepe. Mit dem Wachstum reichten die älteren Produktionsflächen nicht mehr aus. 1884 wurde zunächst die Gesenkschmiede in das Gebiet westlich des Hagener Hauptbahnhofs verlagert. Ab 1905 beziehungsweise 1906 war dort auch die Schraubenfabrik selbst ansässig. Das ist der Ort, an dem Sie sich gerade befinden. Der Standort bot alles, was ein wachsender Industriebetrieb brauchte: große Flächen, eine günstige Eisenbahnanbindung und gute Voraussetzungen für die Anlieferung schwerer Rohstoffe. In unmittelbarer Nähe lag außerdem das mit der Familie verbundene Puddel- und Walzwerk Funcke und Elbers, das der Versorgung mit geeignetem Vormaterial diente. Diese räumliche und unternehmerische Nähe zwischen Rohstoffaufbereitung, Walzwerk, Schmiede und Schraubenproduktion zeigt, wie arbeitsteilig und zugleich eng verflochten die Hagener Metallindustrie bereits im 19. Jahrhundert war. Das Gebäude liegt am Fuß der Philippshöhe, parallel zur Ennepe. Achten Sie auf die langen Fensterreihen: Sie sollten so viel Tageslicht wie möglich in die Produktionsräume bringen.`,\n\n`Station 6. Frühe betriebliche Sozialpolitik. Funcke und Hueck führte vergleichsweise früh Einrichtungen für die Belegschaft ein. Belegt sind eine Unterstützungskasse ab 1855 und eine Arbeitersparkasse ab 1869. Später kamen Werkswohnungen, Versorgungs- und Speiseeinrichtungen sowie weitere Spar- und Pensionsangebote hinzu. Die Unterstützungskasse wuchs beträchtlich: Für 1880 werden 375 Mitglieder genannt, 1885 waren es 551, 1890 bereits 930 und 1895 schließlich 986. Vieles davon entstand lange vor dem vollständigen Ausbau der staatlichen Sozialversicherung. Man sollte diese Fürsorge allerdings nicht ausschließlich aus heutiger Sicht romantisieren. Solche betrieblichen Systeme boten echten Schutz und echte Unterstützung. Sie banden die Beschäftigten aber zugleich eng an den Arbeitgeber und waren Teil einer paternalistisch geprägten Unternehmenskultur. Wer die Werkswohnung verlor, verlor oft beides — Arbeit und Zuhause.`,\n\n`Station 7. Menschen und Netzwerk. Hinter der Fabrik stehen Personen, deren Wirken weit über das Werkstor hinausreichte. Wilhelm Funcke der Zweite, im Volksmund „Schruwen-Willm“ genannt, führte das Unternehmen ab 1846 und machte es zum Großbetrieb. Er saß in der Handelskammer zu Hagen, war 1868 kurzzeitig ihr Präsident und gehörte zu den Mitbegründern des Centralverbandes Deutscher Industrieller. 1875 trat Theodor Springmann als Teilhaber ein und blieb bis 1926. Von 1903 bis 1920 stand er an der Spitze der Handelskammer; 1925 verlieh ihm die Stadt Hagen die Ehrenbürgerwürde. Besonders bemerkenswert ist eine kulturgeschichtliche Verbindung: Karl Ernst Osthaus war ein Enkel Wilhelm Funckes. Ein Teil des Vermögens, das hier mit Schrauben und Eisenbahnbedarf entstand, ermöglichte 1902 das Folkwang-Museum und jenen kulturellen Aufbruch, der als „Hagener Impuls“ bekannt wurde. Und schließlich Liselotte Funcke: Sie arbeitete von 1944 bis 1969 als Prokuristin in diesem Unternehmen und wurde später Bundestagsvizepräsidentin, Wirtschaftsministerin von Nordrhein-Westfalen und Ausländerbeauftragte der Bundesregierung.`,\n\n`Station 8. Kriege, Lost Place und Neubeginn. Wie andere große metallverarbeitende Betriebe wurde Funcke und Hueck in beiden Weltkriegen in die Kriegswirtschaft einbezogen. Für 1944 ist ein Verlagerungsbetrieb unter der Bezeichnung Kleinpresswerk dokumentiert, ebenso die Verlagerung von Teilen der Produktion in geschützte Bereiche. Zu der Frage, ob und in welchem Umfang Zwangsarbeitskräfte eingesetzt wurden, liegen uns keine gesicherten Angaben vor — hier wäre eine gezielte Archivauswertung nötig, und bis dahin verzichten wir bewusst auf Behauptungen. 1970 wurde das Unternehmen an den Neusser Schraubenhersteller Bauer und Schaurte verkauft. Aus dessen Namen entstand die Marke INBUS — erfunden hat Funcke und Hueck dieses System allerdings nicht. Anfang der 1990er-Jahre endete die Produktion. 1991 diente das Gelände als Filmkulisse für Teile von „Manta, Manta“. 2001 wurden große Teile abgerissen, der Rest verfiel und wurde zu einem bekannten Hagener Lost Place. Seit 2021 wird das erhaltene Gebäude denkmalgerecht saniert. Es entstehen Bildungs-, Seminar-, Veranstaltungs-, Hotel- und Gastronomiebereiche. Denkmalpflege heißt hier nicht Konservieren, sondern Weiterbauen. Vielen Dank für Ihren Besuch.`,\n];\n\n// ── GALLERY (current condition — no historic photos survive) ──\nconst GALLERY = [\n  { src:'img/g1.jpg', cap:'Backsteinfassade an der Ennepe. Die gereihten Fensterachsen brachten Tageslicht in die Produktionsräume.' },\n  { src:'img/g2.jpg', cap:'Produktionshalle mit gusseisernen Stützen — Blick in den Zustand vor der Sanierung.' },\n  { src:'img/g3.jpg', cap:'Treppenhaus im Rohzustand. Über solche Aufgänge waren die Werksteile miteinander verbunden.' },\n  { src:'img/g6.jpg', cap:'Rundbogenfenster über dem neuen Eingang: erhaltene Substanz trifft heutige Nutzung.' },\n  { src:'img/g4.jpg', cap:'Die Ennepe entlang der Werksmauer. Wasser und Bahn bestimmten die Standortwahl.' },\n  { src:'img/g5.jpg', cap:'Detail der sanierten Fassade am Fuß der Philippshöhe.' },\n];\n\nlet tickTimer = null;\nlet synth = window.speechSynthesis;\nlet currentUtterance = null;\nlet speechStartTime = null;\nlet speechPauseOffset = 0;\n\nfunction setState(partial) {\n  state = { ...state, ...partial };\n  render();\n}\n\n// ── SPEECH E
